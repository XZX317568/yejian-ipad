[package]
name = "yejian"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
default-run = "yejian"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "yejian"
path = "src/main.rs"

[[bin]]
name = "acceptance"
path = "src/bin/acceptance.rs"
required-features = ["acceptance"]

[workspace]
members = ["crates/reader-core", "crates/source-engine", "platform"]
resolver = "3"

[features]
default = []
acceptance = ["dep:egui-wgpu", "dep:wgpu"]

[dependencies]
anyhow = "1"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yejian-core = { path = "crates/reader-core" }
yejian-sources = { path = "crates/source-engine" }
yejian-platform = { path = "platform" }
mangayomi_sync_host = { path = "../app/rust/sync_host" }
tokio = { version = "1.50", features = ["rt-multi-thread", "time", "sync"] }
log = "0.4"
pollster = "0.4"
zip = { version = "8.5", default-features = false, features = ["deflate"] }
egui-wgpu = { version = "=0.37.0", optional = true, default-features = false }
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "dx12", "wgsl"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["android-native-activity", "wgpu", "default_fonts"] }
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }
android_logger = "0.15"
jni = "0.21.1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
zip = { version = "8.5", default-features = false, features = ["deflate"] }

[profile.dev]
debug = 0
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

