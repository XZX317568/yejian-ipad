[package]
name = "yejian-sources"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Native Aidoku WebAssembly source engine for the Yejian reader"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.44"
ego-tree = "0.11.0"
futures-channel = "0.3.31"
html5ever = "=0.39.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
once_cell = "1.21.4"
parking_lot = "0.12.5"
regex = "1.13.1"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "cookies", "charset", "http2", "rustls", "stream", "brotli", "gzip", "socks"] }
rquickjs = { version = "0.11", features = ["parallel"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5.8"
wasmi = "2.0.0"
webpki-roots = "1.0"
zip = { version = "8.5.0", default-features = false, features = ["deflate"] }

# rquickjs-sys ships pre-generated bindings only for common targets; none
# cover iOS arm64/sim, so Apple targets must generate them with bindgen
# (requires libclang at build time). All other targets keep the plain
# `parallel` dep above and stay bindgen-free.
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "0.11", features = ["bindgen", "parallel"] }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"
wat = "1.246.2"
