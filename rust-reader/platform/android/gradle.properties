# Keep mobile packaging usable on this 16 GB machine. One worker, one JVM.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:MaxDirectMemorySize=192m -XX:+UseSerialGC -XX:ActiveProcessorCount=2
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=false
android.newDsl=false
android.builtInKotlin=false
