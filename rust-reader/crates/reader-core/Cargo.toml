[package]
name = "yejian-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Persistent local comic library, archive page reader, backups and legacy Mangayomi migration for Yejian."

[lib]
name = "yejian_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
crc32fast = "1"
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rars = "0.9.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
zip = { version = "8.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
